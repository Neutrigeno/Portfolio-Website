<!doctype html>
<html lang="en">
  <head>
   <link id="favicon" rel="icon" type="image/png" href="/images/Favicon-black.png">
   <script>
  const darkMode = window.matchMedia("(prefers-color-scheme: dark)");
  function updateFavicon() {
    document.getElementById("favicon").href = darkMode.matches
      ? "/images/Favicon-white.png"
      : "/images/Favicon-black.png";
  }
  updateFavicon();
  darkMode.addEventListener("change", updateFavicon);
</script>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>Portfolio</title>
  </head>
  <body style="margin: 0;">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
